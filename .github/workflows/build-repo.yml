name: Build package repo

# Builds the packages listed in repo/packages.txt for the custom package ID and publishes them
# as a flat apt repository in the "repo" release of this GitHub repository. A full build needs
# several runs (the heavy packages each take hours); every run starts the next one by itself
# until everything is built. Manual start: Actions tab -> "Build package repo" -> Run workflow.
run-name: Build package repo (run ${{ inputs.run_index }})

on:
  workflow_dispatch:
    inputs:
      package_name:
        description: "Package ID the packages are built for (must be the same as the app you build)"
        required: false
        type: string
        default: "com.ksmusic.termux"
      add_packages:
        description: "Add packages: comma-separated names. They are appended to repo/packages.txt and built"
        required: false
        type: string
        default: ""
      only:
        description: "Test mode: build ONLY these packages (plus dependencies) and ignore repo/packages.txt"
        required: false
        type: string
        default: ""
      rebuild:
        description: "Comma-separated packages to rebuild even though they are already published"
        required: false
        type: string
        default: ""
      retry_failed:
        description: "Forget earlier failures and try the failed packages again"
        required: false
        type: choice
        default: "false"
        options:
          - "false"
          - "true"
      chain:
        description: "Start the next run automatically while packages are left"
        required: false
        type: choice
        default: "true"
        options:
          - "true"
          - "false"
      max_runs:
        description: "Stop starting follow-up runs after this many runs"
        required: false
        type: string
        default: "20"
      run_index:
        description: "Internal: number of this run in the chain (leave at 1)"
        required: false
        type: string
        default: "1"

permissions:
  contents: read

concurrency:
  group: build-repo
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    permissions:
      contents: write
    outputs:
      more: ${{ steps.build.outputs.more }}
    env:
      PACKAGE_NAME: ${{ inputs.package_name }}
      ADD_PACKAGES: ${{ inputs.add_packages }}
      ONLY: ${{ inputs.only }}
      REBUILD: ${{ inputs.rebuild }}
      RETRY_FAILED: ${{ inputs.retry_failed }}
      CI_PROJECT_DIR: ${{ github.workspace }}
      GH_TOKEN: ${{ github.token }}
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Start the clock
        run: |
          now=$(date +%s)
          {
            echo "JOB_START=$now"
            echo "DEADLINE_SOFT=$((now + 325 * 60))"
            echo "DEADLINE_HARD=$((now + 340 * 60))"
          } >> "$GITHUB_ENV"

      - name: Check runner user
        run: |
          id
          # ghcr.io/termux/package-builder runs as UID 1001; the hosted runner user must match.
          if [ "$(id -u)" != "1001" ]; then
            echo "ERROR: expected the runner user to have UID 1001, got $(id -u)"
            exit 1
          fi

      - name: Free disk space and move Docker to /mnt
        run: |
          df -h / /mnt
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          docker image prune --all --force > /dev/null 2>&1 || true
          # The temporary disk on /mnt is much larger than the root disk; large packages
          # (llvm, rust) need the space for their build trees.
          if sudo systemctl stop docker.socket docker.service; then
            sudo mkdir -p /mnt/docker /etc/docker
            if [ -s /etc/docker/daemon.json ]; then cfg=$(cat /etc/docker/daemon.json); else cfg='{}'; fi
            echo "$cfg" | jq '. + {"data-root": "/mnt/docker"}' | sudo tee /etc/docker/daemon.json > /dev/null
            sudo systemctl start docker.service
          else
            echo "::warning::Could not stop Docker; building with the default storage location"
          fi
          docker info --format 'Docker root: {{.DockerRootDir}}'
          df -h / /mnt

      - name: Install host packages
        run: |
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y --no-install-recommends ca-certificates git patch curl file xz-utils jq python3 procps sudo

      - name: Add packages to repo/packages.txt
        if: inputs.add_packages != ''
        run: |
          bash repo/add-packages.sh "$ADD_PACKAGES"
          if ! git diff --quiet -- repo/packages.txt; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add repo/packages.txt
            git commit -m "repo: add packages from the workflow input"
            git push || echo "::warning::Could not push repo/packages.txt (protected branch?). The names are built anyway; add them to the file by hand to keep them."
          fi

      - name: Prepare termux-packages
        env:
          REPO_URL: https://github.com/${{ github.repository }}/releases/download/repo/
        run: bash repo/prepare-packages.sh

      - name: Build and publish packages
        id: build
        run: python3 repo/build_repo.py run

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repo-build-logs-run-${{ inputs.run_index }}
          path: repo-work/logs/*.gz
          retention-days: 7
          if-no-files-found: ignore

  chain:
    name: Start the next run
    needs: build
    if: needs.build.outputs.more == 'true' && inputs.chain == 'true' && fromJSON(inputs.run_index) < fromJSON(inputs.max_runs)
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      PACKAGE_NAME: ${{ inputs.package_name }}
      ADD_PACKAGES: ${{ inputs.add_packages }}
      ONLY: ${{ inputs.only }}
      MAX_RUNS: ${{ inputs.max_runs }}
      RUN_INDEX: ${{ inputs.run_index }}
      REF_NAME: ${{ github.ref_name }}
    steps:
      - name: Dispatch the next run
        run: |
          gh workflow run build-repo.yml --repo "$GITHUB_REPOSITORY" --ref "$REF_NAME" \
            -f package_name="$PACKAGE_NAME" \
            -f add_packages="$ADD_PACKAGES" \
            -f only="$ONLY" \
            -f chain=true \
            -f max_runs="$MAX_RUNS" \
            -f run_index="$((RUN_INDEX + 1))"
          echo "Started run $((RUN_INDEX + 1))"
