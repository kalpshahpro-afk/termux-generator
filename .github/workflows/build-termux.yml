name: Build custom Termux

# Manual build only: Actions tab -> "Build custom Termux" -> Run workflow.
# Ported from .gitlab-ci.yml; the build scripts in .github/scripts/ are the same ones the GitLab job runs.
on:
  workflow_dispatch:
    inputs:
      package_name:
        description: "Custom Android package name (no dashes/underscores, no 'com.termux', no Java keywords)"
        required: false
        type: string
        default: "com.rebranded.termux"
      app_name:
        description: "App display name shown in the Android launcher (required)"
        required: true
        type: string
      startup_message:
        description: "Startup message (MOTD) shown above the terminal prompt. Leave empty for 'Welcome to <app name>'"
        required: false
        type: string
        default: ""
      architectures:
        description: "Comma-separated architectures: aarch64, arm, i686, x86_64 (aarch64 covers nearly all phones)"
        required: false
        type: string
        default: "aarch64"
      addons:
        description: "Addon apps to build: 'none', 'all', or comma-separated from tasker,float,widget,api,boot,styling,gui,x11 (e.g. api,styling)"
        required: false
        type: string
        default: "none"
      extra_packages:
        description: "Comma-separated extra packages to pre-install, e.g. git,openssh,openjdk-17,gradle (fzf and tmux are always added)"
        required: false
        type: string
        default: ""
      icon_hue_shift:
        description: "Shift the hue of the neon-green >_ icon accent per package name so every sandbox APK gets its own colour (background stays #000000)"
        required: false
        type: choice
        default: "true"
        options:
          - "true"
          - "false"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env:
      PACKAGE_NAME: ${{ inputs.package_name }}
      APP_NAME: ${{ inputs.app_name }}
      STARTUP_MESSAGE: ${{ inputs.startup_message }}
      ARCHITECTURES: ${{ inputs.architectures }}
      ADDONS: ${{ inputs.addons }}
      EXTRA_PACKAGES: ${{ inputs.extra_packages }}
      ICON_HUE_SHIFT: ${{ inputs.icon_hue_shift }}
      CI_PROJECT_DIR: ${{ github.workspace }}
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
      ANDROID_SDK_ROOT: /usr/lib/android-sdk
      ANDROID_HOME: /usr/lib/android-sdk
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check runner user
        run: |
          id
          # ghcr.io/termux/package-builder runs as UID 1001; the hosted runner user must match.
          if [ "$(id -u)" != "1001" ]; then
            echo "ERROR: expected the runner user to have UID 1001, got $(id -u)"
            exit 1
          fi

      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          docker image prune --all --force > /dev/null 2>&1 || true
          df -h /

      - name: Install host packages
        run: |
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y --no-install-recommends ca-certificates openjdk-17-jdk-headless git patch curl wget unzip zip file xz-utils bzip2 python3 python3-pil bison procps sudo jq rsync
          locale charmap
          "$JAVA_HOME/bin/java" -version

      - name: Install Android command-line tools
        run: |
          sudo mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          sudo chown -R "$(id -u):$(id -g)" "$ANDROID_SDK_ROOT"
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdline-tools.zip
          unzip -q /tmp/cmdline-tools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
          mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          rm -f /tmp/cmdline-tools.zip
          export PATH="$JAVA_HOME/bin:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null || [ $? -eq 141 ]

      - name: Keep build variables through sudo
        run: |
          printf 'Defaults env_keep += "ANDROID_SDK_ROOT ANDROID_HOME JAVA_HOME LANG LC_ALL APP_NAME STARTUP_MESSAGE PACKAGE_NAME EXTRA_PACKAGES ICON_HUE_SHIFT"\n' | sudo tee /etc/sudoers.d/termux-build-env > /dev/null
          sudo chmod 0440 /etc/sudoers.d/termux-build-env

      - name: Use Maven Central mirror for host Gradle builds
        run: |
          mkdir -p "$HOME/.gradle/init.d"
          install -m 644 .github/scripts/maven-mirror.init.gradle "$HOME/.gradle/init.d/maven-mirror.gradle"

      - name: Hook pre-flight and branding into build-termux.sh
        run: |
          chmod +x build-termux.sh
          install -m 755 .github/scripts/preflight-packages.sh /tmp/preflight-packages.sh
          python3 .github/scripts/hook-build-termux.py
          grep -n -C 1 -E "bootstraps|apply_custom" build-termux.sh

      - name: Build Termux
        run: bash .github/scripts/run-build.sh

      - name: Build summary
        if: always()
        run: |
          {
            echo "### Termux build"
            echo
            echo "| Setting | Value |"
            echo "|---|---|"
            echo "| Package ID | \`${PACKAGE_NAME}\` |"
            echo "| App name | ${APP_NAME//|/\\|} |"
            echo "| Startup message | ${STARTUP_MESSAGE:-(default: Welcome to app name)} |"
            echo "| Architectures | ${ARCHITECTURES} |"
            echo "| Addons | ${ADDONS} |"
            echo "| Extra packages | ${EXTRA_PACKAGES:-(none)}, fzf, tmux |"
            echo
            echo "Output files:"
            echo
            echo '```'
            ls -lh ./*.apk ./*.zip ./build.log.gz 2>/dev/null || echo "(none)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APKs and build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: termux-${{ inputs.package_name }}-f-droid
          path: |
            *.apk
            *.zip
            build.log.gz
          retention-days: 7
          if-no-files-found: warn
